<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldMap – Karte</title>
  <link rel="icon" type="image/webp" href="https://www.9ps.eu/dnd/items/Worldmapper/worldmapper_icon_small.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bilbo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Polyfill: verhindert Fehler in Umgebungen ohne WebAuthn-Support
    if (!window.PublicKeyCredential) {
      window.PublicKeyCredential = {
        isUserVerifyingPlatformAuthenticatorAvailable: async () => false,
        isConditionalMediationAvailable: async () => false
      };
    }
  </script>
</head>

<body class="map-page">

  <!-- Top bar -->
  <div class="map-topbar">
    <div class="topbar-left">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm" id="backBtn" style="display:none">← Dashboard</a>
      <h2 id="mapTitle">Lädt…</h2>
      <span id="viewerCount" style="font-size:12px;color:var(--text-dim);margin-left:.3rem"></span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" id="measureBtn" title="Entfernung messen">📏 Messen</button>
      <button class="btn btn-ghost btn-sm" id="toggleSidebarBtn">☰ Ebenen</button>
      <button class="btn btn-primary btn-sm hidden" id="toggleEditorBtn">✏️ Editor</button>
      <div style="position:relative">
        <button class="btn btn-ghost btn-sm" id="settingsMenuBtn" title="Einstellungen">⚙</button>
        <div id="settingsPanel" class="settings-panel hidden"></div>
      </div>
    </div>
  </div>

  <!-- Scale bar (bottom-centre, injected by JS) -->
  <div id="scaleBar" class="scale-bar" style="display:none"></div>

  <!-- Left sidebar: layer toggles per group -->
  <div class="map-sidebar" id="mapSidebar">
    <div class="sidebar-header">
      <h3>Ebenen</h3>
      <button class="btn-icon" onclick="document.getElementById('mapSidebar').classList.remove('open')">✕</button>
    </div>
    <div id="groupList" class="group-list"></div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Admin editor panel -->
  <div class="editor-panel hidden" id="editorPanel">
    <div class="editor-header">
      <span>✏️ Editor</span>
      <button class="btn-icon" onclick="document.getElementById('editorPanel').classList.add('hidden')">✕</button>
    </div>
    <div class="editor-tabs">
      <button class="etab active" data-tab="groups">Gruppen</button>
      <button class="etab" data-tab="pois">POIs</button>
      <button class="etab" data-tab="routes">Routen</button>
      <button class="etab" data-tab="regions">Regionen</button>
      <button class="etab" data-tab="fog">Nebel</button>
    </div>
    <div class="editor-content" id="editorContent"></div>
  </div>

  <!-- Feature edit modal -->
  <div id="featureModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeFeatureModal()"></div>
    <div class="modal-dialog modal-xl">
      <div class="modal-header">
        <h3 id="featureModalTitle">Element</h3>
        <button class="modal-close" onclick="closeFeatureModal()">✕</button>
      </div>
      <div id="featureModalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/fog.js"></script>
  <script src="js/map.js"></script>
</body>

</html>
